name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Release uses normal accounts; Debug uses the development server. Both use interpreter builds.'
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release
      xcode_version:
        description: 'Installed Xcode version (27.0 matches the current .NET iOS workload)'
        required: false
        default: '27.0'
        type: string

permissions:
  contents: read

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode_version }}
        run: |
          if [ -n "$XCODE_VERSION" ]; then
            XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
            if [ ! -d "$XCODE_PATH" ]; then
              echo "::error::Xcode $XCODE_VERSION is not installed on this runner. Available installations:"
              find /Applications -maxdepth 1 -name 'Xcode*.app' -print
              exit 1
            fi
            sudo xcode-select --switch "$XCODE_PATH"
          fi
          xcodebuild -version

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Build device IPA for signing with a sideloading tool
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        # Command-line properties override the Release AOT defaults in osu.iOS.props.
        # Keep Release server selection without the expensive trimming/AOT passes.
        run: |
          mkdir -p artifacts
          dotnet build osu.iOS/osu.iOS.csproj \
          -c "$BUILD_CONFIGURATION" -r ios-arm64 \
          -p:TrimMode=copy \
          -p:MtouchInterpreter=all \
          -p:EnableCodeSigning=false \
          -p:CodesignRequireProvisioningProfile=false \
          -p:CodesignKey= \
          -p:BuildIpa=true \
          -v normal \
          -bl:artifacts/ios-build.binlog \
          -p:IpaPackageDir="${{ github.workspace }}/artifacts/"

      - uses: actions/upload-artifact@v7
        with:
          name: osu-ios-unsigned
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: osu-ios-build-diagnostics
          path: artifacts/ios-build.binlog
          if-no-files-found: ignore
          retention-days: 7
